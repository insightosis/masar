<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المراجعة · مسار · الصف الحادي عشر</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/site.css">
<style>
.intro{margin:18px 0 6px}
.intro h1{font-size:clamp(2rem,6vw,2.8rem);margin:0}
.tabs{display:flex;gap:8px;margin:14px 0 10px}
.tabs button,.filters button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#1b2560;color:var(--text);padding:6px 16px;border-radius:12px}
.tabs button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#1a1405;font-weight:700}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.filters button{font-size:14px;padding:3px 12px;border-radius:99px}
.filters button[aria-pressed=true]{border-color:var(--sc);color:var(--sc);background:color-mix(in srgb,var(--sc) 12%,transparent)}
input[type=search]{width:100%;font:inherit;color:var(--text);background:#0f1638;border:1px solid var(--line);border-radius:12px;padding:8px 14px;margin-bottom:12px}
.group{margin-bottom:18px}
.group h3{margin:0 0 8px;font-size:1.05rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.group h3 a{text-decoration:none}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.term{border:1px solid var(--line);border-inline-start:4px solid var(--sc);border-radius:12px;padding:8px 12px;background:rgba(20,28,69,.75)}
.term .tw{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;align-items:baseline}
.term b{font-family:var(--display)}
.term .en{direction:ltr;unicode-bidi:isolate;font-family:var(--mono);font-size:12.5px;color:var(--sc)}
.term p{margin:2px 0 0;font-size:14px;color:var(--muted);line-height:1.6}
.gold{display:grid;gap:8px}
.gp{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 14px;border-radius:14px;background:linear-gradient(100deg,rgba(255,181,71,.13),rgba(255,181,71,.02) 70%);border:1px solid rgba(255,181,71,.35)}
.gp p{margin:0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:0 8px;border-radius:6px;margin-inline-end:6px}
.tag.exam{background:var(--accent);color:#1a1405}.tag.trap{background:#ff6b7d;color:#2a0a10}.tag.fast{background:#4fd8ff;color:#06222b}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="index.html"><span class="dot"></span>مسار · الصف الحادي عشر</a>
    <nav class="nav" aria-label="أقسام الموقع">
      <a href="index.html">لوحة التتبع</a>
      <a href="plan.html">الخطة</a>
      <a href="review.html" aria-current="page">المراجعة</a>
    </nav>
  </header>
  <div class="intro">
    <h1>المراجعة</h1>
    <p class="muted" style="margin:4px 0 0">كل المصطلحات والنقاط الذهبية من الدروس المنشورة، في مكان واحد قبل الاختبار.</p>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-terms" aria-selected="true" aria-controls="p-terms">المصطلحات</button>
    <button role="tab" id="tab-gold" aria-selected="false" aria-controls="p-gold">النقاط الذهبية</button>
  </div>
  <div class="filters" id="filters" aria-label="تصفية حسب المادة"></div>
  <div id="p-terms" role="tabpanel" aria-labelledby="tab-terms">
    <label for="q" class="muted" style="font-size:14px">ابحث بالعربي أو بالإنجليزي</label>
    <input type="search" id="q" placeholder="مثلاً: المدى أو Range">
    <div id="terms"></div>
  </div>
  <div id="p-gold" role="tabpanel" aria-labelledby="tab-gold" hidden><div id="gold"></div></div>
  <footer>تُحدَّث تلقائياً مع كل درس جديد</footer>
</div>
<script src="assets/data.js"></script>
<script src="assets/lab.js"></script>
<script>
(function(){
"use strict";
var D=window.LAB,S=D.subjects,L=(D.lessons||[]).slice().sort(function(a,b){return a.date<b.date?1:-1;});
var subj="all", q="";
var TAG={exam:"سؤال مكرر",fast:"قاعدة سريعة",trap:"فخ"};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var f=document.getElementById("filters");
f.innerHTML='<button data-s="all" aria-pressed="true" style="--sc:#ffb547">الكل</button>'+Object.keys(S).map(function(k){return '<button data-s="'+k+'" aria-pressed="false" style="--sc:'+S[k].color+'">'+esc(S[k].name)+'</button>';}).join("");
f.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;subj=b.getAttribute("data-s");Array.prototype.forEach.call(f.children,function(x){x.setAttribute("aria-pressed",String(x===b));});render();});
document.getElementById("q").addEventListener("input",function(){q=this.value.trim().toLowerCase();render();});
["terms","gold"].forEach(function(k){document.getElementById("tab-"+k).addEventListener("click",function(){
  ["terms","gold"].forEach(function(j){document.getElementById("tab-"+j).setAttribute("aria-selected",String(j===k));document.getElementById("p-"+j).hidden=j!==k;});
});});
function head(l){var s=S[l.subject];return '<h3><span class="chip" style="color:'+s.color+'">'+esc(s.name)+'</span><a href="'+esc(l.url)+'">'+esc(l.title)+'</a></h3>';}
function render(){
  var ls=L.filter(function(l){return subj==="all"||l.subject===subj;});
  var th=ls.map(function(l){
    var ts=(l.terms||[]).filter(function(t){return !q||(t.ar+" "+t.en+" "+t.def).toLowerCase().indexOf(q)>-1;});
    if(!ts.length)return "";
    return '<div class="group">'+head(l)+'<div class="terms">'+ts.map(function(t){return '<div class="term" style="--sc:'+S[l.subject].color+'"><div class="tw"><b>'+esc(t.ar)+'</b><span class="en">'+esc(t.en)+'</span></div><p>'+esc(t.def)+'</p></div>';}).join("")+'</div></div>';
  }).join("");
  document.getElementById("terms").innerHTML=th||'<div class="empty">لا نتائج.</div>';
  var gh=ls.map(function(l){
    if(!(l.gold||[]).length)return "";
    return '<div class="group">'+head(l)+'<div class="gold">'+l.gold.map(function(g){return '<div class="gp"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z" fill="#ffb547"/></svg><p><span class="tag '+g.type+'">'+TAG[g.type]+'</span>'+esc(g.text)+'</p></div>';}).join("")+'</div></div>';
  }).join("");
  document.getElementById("gold").innerHTML=gh||'<div class="empty">لا نقاط بعد.</div>';
}
render();
})();
</script>
</body>
</html>
