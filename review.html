<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المراجعة · مسار · الصف الحادي عشر</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/site.css">
<script>try{var t=localStorage.getItem("masar.theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
.intro{margin:18px 0 6px}
.intro h1{font-size:clamp(2.1rem,6vw,2.9rem);margin:0}
.tabs{display:flex;gap:10px;margin:16px 0 12px}
.tabs button,.filters button{font:inherit;font-weight:700;cursor:pointer;border:0;color:var(--text);padding:8px 18px;border-radius:18px;background:var(--card);box-shadow:var(--clay-sm)}
.tabs button[aria-selected=true]{background:var(--accent-soft)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filters button{font-size:14px;padding:4px 14px;border-radius:99px}
.filters button[aria-pressed=true]{background:var(--soft);color:var(--ink)}
input[type=search]{width:100%;font:inherit;color:var(--text);background:var(--card);border:0;border-radius:18px;padding:10px 16px;margin:4px 0 14px;box-shadow:var(--press)}
.group{margin-bottom:22px}
.group h3{margin:0 0 10px;font-size:1.15rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.group h3 a{text-decoration:none}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.term{border-radius:20px;padding:10px 14px;background:var(--soft);box-shadow:var(--clay-sm)}
.term .tw{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;align-items:baseline}
.term b{font-family:var(--display);font-weight:800;font-size:1.1rem}
.term .en{direction:ltr;unicode-bidi:isolate;font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.term p{margin:2px 0 0;font-size:14px;color:var(--muted);line-height:1.6}
.gold{display:grid;gap:10px}
.gp{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px 16px;border-radius:20px;background:var(--p-butter);box-shadow:var(--clay-sm)}
.gp p{margin:0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:0 8px;border-radius:8px;margin-inline-end:6px;color:#fff}
.tag.exam{background:#f2a33d}.tag.trap{background:#e0607e}.tag.fast{background:#5aa9e6}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="index.html"><span class="dot"></span>مسار · الصف الحادي عشر</a>
    <nav class="nav" aria-label="أقسام الموقع">
      <a href="index.html">لوحة التتبع</a>
      <a href="plan.html">الخطة</a>
      <a href="review.html" aria-current="page">المراجعة</a>
    </nav>
  </header>
  <div class="intro">
    <h1>المراجعة</h1>
    <p class="muted" style="margin:4px 0 0">كل المصطلحات والنقاط الذهبية من الدروس المنشورة، في مكان واحد قبل الاختبار.</p>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-terms" aria-selected="true" aria-controls="p-terms">المصطلحات</button>
    <button role="tab" id="tab-gold" aria-selected="false" aria-controls="p-gold">النقاط الذهبية</button>
  </div>
  <div class="filters" id="filters" aria-label="تصفية حسب المادة"></div>
  <div id="p-terms" role="tabpanel" aria-labelledby="tab-terms">
    <label for="q" class="muted" style="font-size:14px">ابحث بالعربي أو بالإنجليزي</label>
    <input type="search" id="q" placeholder="مثلاً: المدى أو Range">
    <div id="terms"></div>
  </div>
  <div id="p-gold" role="tabpanel" aria-labelledby="tab-gold" hidden><div id="gold"></div></div>
  <footer>تُحدَّث تلقائياً مع كل درس جديد</footer>
</div>
<script src="assets/data.js"></script>
<script src="assets/lab.js"></script>
<script>
(function(){
"use strict";
var D=window.LAB,S=D.subjects,L=(D.lessons||[]).slice().sort(function(a,b){return a.date<b.date?1:-1;});
var subj="all", q="";
var TAG={exam:"سؤال مكرر",fast:"قاعدة سريعة",trap:"فخ"};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var f=document.getElementById("filters");
f.innerHTML='<button data-s="all" aria-pressed="true" style="--sc:#d1557a;--soft:var(--p-pink)">الكل</button>'+Object.keys(S).map(function(k){return '<button data-s="'+k+'" aria-pressed="false" style="--sc:'+S[k].color+'">'+esc(S[k].name)+'</button>';}).join("");
f.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;subj=b.getAttribute("data-s");Array.prototype.forEach.call(f.children,function(x){x.setAttribute("aria-pressed",String(x===b));});render();});
document.getElementById("q").addEventListener("input",function(){q=this.value.trim().toLowerCase();render();});
["terms","gold"].forEach(function(k){document.getElementById("tab-"+k).addEventListener("click",function(){
  ["terms","gold"].forEach(function(j){document.getElementById("tab-"+j).setAttribute("aria-selected",String(j===k));document.getElementById("p-"+j).hidden=j!==k;});
});});
function head(l){var s=S[l.subject];return '<h3><span class="chip" style="--sc:'+s.color+'">'+esc(s.name)+'</span><a href="'+esc(l.url)+'">'+esc(l.title)+'</a></h3>';}
function render(){
  var ls=L.filter(function(l){return subj==="all"||l.subject===subj;});
  var th=ls.map(function(l){
    var ts=(l.terms||[]).filter(function(t){return !q||(t.ar+" "+t.en+" "+t.def).toLowerCase().indexOf(q)>-1;});
    if(!ts.length)return "";
    return '<div class="group">'+head(l)+'<div class="terms">'+ts.map(function(t){return '<div class="term" style="--sc:'+S[l.subject].color+'"><div class="tw"><b>'+esc(t.ar)+'</b><span class="en">'+esc(t.en)+'</span></div><p>'+esc(t.def)+'</p></div>';}).join("")+'</div></div>';
  }).join("");
  document.getElementById("terms").innerHTML=th||'<div class="empty">لا نتائج.</div>';
  var gh=ls.map(function(l){
    if(!(l.gold||[]).length)return "";
    return '<div class="group">'+head(l)+'<div class="gold">'+l.gold.map(function(g){return '<div class="gp"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z" fill="#f2b33d"/></svg><p><span class="tag '+g.type+'">'+TAG[g.type]+'</span>'+esc(g.text)+'</p></div>';}).join("")+'</div></div>';
  }).join("");
  document.getElementById("gold").innerHTML=gh||'<div class="empty">لا نقاط بعد.</div>';
}
render();
})();
</script>
</body>
</html>
