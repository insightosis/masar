# Deploys sync/worker.js to Cloudflare as "masar-sync" (https://masar-sync.insightosis.workers.dev).
# Needs one repo secret: CLOUDFLARE_API_TOKEN (Cloudflare template "Edit Cloudflare Workers").
# Creates the KV namespace "masar-progress" the first time; reuses it after that.
name: deploy-sync

on:
  push:
    branches: [main]
    paths: ["sync/**", ".github/workflows/sync.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-sync
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: bbb0ff7d413cd926d9877f13727c094c
    steps:
      - name: Check the token is there
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set yet; nothing deployed."
            echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'yes'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'yes'
        with:
          node-version: 22

      - name: KV namespace (find or create)
        if: steps.gate.outputs.go == 'yes'
        id: kv
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          id=$(curl -fsS -H "$auth" "$api?per_page=100" | jq -r '.result[] | select(.title=="masar-progress") | .id' | head -n1)
          if [ -z "$id" ]; then
            id=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" \
                 --data '{"title":"masar-progress"}' "$api" | jq -r '.result.id')
          fi
          [ -n "$id" ] && [ "$id" != "null" ]
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: steps.gate.outputs.go == 'yes'
        working-directory: sync
        run: |
          set -euo pipefail
          cat > wrangler.toml <<EOF
          name = "masar-sync"
          main = "worker.js"
          compatibility_date = "2026-11-01"
          workers_dev = true
          account_id = "$CLOUDFLARE_ACCOUNT_ID"

          [[kv_namespaces]]
          binding = "MASAR"
          id = "${{ steps.kv.outputs.id }}"
          EOF
          npx --yes wrangler@4 deploy

      - name: Smoke test
        if: steps.gate.outputs.go == 'yes'
        run: |
          sleep 5
          curl -fsS https://masar-sync.insightosis.workers.dev/ | tee /dev/stderr | grep -q masar-sync
