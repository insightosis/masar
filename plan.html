<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الخطة · مسار · الصف الحادي عشر</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/site.css">
<style>
.intro{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:18px;align-items:stretch}
@media (max-width:780px){.intro{grid-template-columns:1fr}}
.count{border-radius:22px;padding:20px 22px;border:1px solid var(--line);background:linear-gradient(150deg,#1d2763,#111840 70%);position:relative;overflow:hidden}
.count h1{font-size:clamp(2rem,6vw,2.9rem);margin:0 0 4px}
.count .big{font-family:var(--mono);font-size:clamp(3rem,11vw,4.6rem);line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.count .big small{font-family:var(--body);font-size:1rem;color:var(--muted);margin-inline-start:8px}
.count p{margin:8px 0 0;color:var(--muted);font-size:14.5px;max-width:52ch}
.phases{display:grid;gap:8px}
.ph{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(20,28,69,.75)}
.ph i{width:14px;height:14px;border-radius:4px;background:var(--pc)}
.ph b{font-weight:700}
.ph span{font-family:var(--mono);font-size:13px;color:var(--muted);direction:ltr}
.ph.now{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc) inset}

.track{display:flex;height:12px;border-radius:9px;overflow:hidden;margin:16px 0 4px;background:rgba(255,255,255,.06);position:relative}
.track i{display:block;height:100%}
.track .needle{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--text);border-radius:2px}
.cover{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.cv{border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:rgba(20,28,69,.75);color:var(--sc)}
.cv .row{display:flex;justify-content:space-between;align-items:center}
.cv h3{margin:0;font-size:1.05rem;color:var(--text)}
.cv p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.cv p b{color:var(--text);font-family:var(--mono);font-weight:500}

.week{margin-top:22px}
.week h3{font-size:1.05rem;margin:0 0 8px;color:var(--muted);font-weight:600}
.days{display:grid;gap:8px}
.day{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:rgba(20,28,69,.6);border-inline-start:4px solid var(--pc)}
.day.today{background:rgba(255,181,71,.08);border-color:var(--accent);border-inline-start-color:var(--accent)}
.day.past{opacity:.6}
.dh{display:flex;flex-direction:column;gap:2px}
.dh b{font-size:15px}
.dh time{font-family:var(--mono);font-size:12.5px;color:var(--muted);direction:ltr;text-align:end}
.dh .mins{font-size:12.5px;color:var(--muted)}
.its{display:flex;flex-direction:column;gap:6px}
.it{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:15px}
.it .code{font-family:var(--mono);font-size:12.5px;color:var(--sc);direction:ltr}
.it a{text-decoration:none;border-bottom:1px solid var(--sc)}
.it .tag{font-size:12px;padding:0 8px;border-radius:6px;background:rgba(255,255,255,.08);color:var(--muted)}
.it .tag.live{background:var(--sc);color:#141005;font-weight:700}
.it .ok{color:var(--ok);font-weight:700}
.it .m{font-size:12.5px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--sc);flex:none}
@media (max-width:520px){.day{grid-template-columns:1fr}.dh{flex-direction:row;gap:10px;align-items:baseline}.dh time{text-align:start}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="index.html"><span class="dot"></span>مسار · الصف الحادي عشر</a>
    <nav class="nav" aria-label="أقسام الموقع">
      <a href="index.html">لوحة التتبع</a>
      <a href="plan.html" aria-current="page">الخطة</a>
      <a href="review.html">المراجعة</a>
    </nav>
  </header>

  <section class="intro" aria-label="ملخص الخطة">
    <div class="count" id="count"></div>
    <div class="phases" id="phases"></div>
  </section>
  <div class="track" id="track" role="img" aria-label="مراحل الخطة حتى الاختبارات"></div>

  <section class="sec" aria-labelledby="h-cov">
    <h2 id="h-cov">تغطية المنهج</h2>
    <div class="cover" id="cover"></div>
  </section>

  <section class="sec" aria-labelledby="h-days">
    <h2 id="h-days">يوماً بيوم</h2>
    <p class="muted" style="margin-top:-6px">كل درس يتكرر بعد يوم في أسئلة الاسترجاع أول الدرس التالي، ومرة كل سبت في مراجعة الأسبوع، ثم في أسبوع التثبيت.</p>
    <div id="weeks"></div>
  </section>

  <footer>المصدر: جداول محتويات كتب الطالب، الفصل الأول 2026/2027 · مواعيد المواد تُضاف عند نشر الجدول الرسمي</footer>
</div>
<script src="assets/plan.js"></script>
<script src="assets/data.js"></script>
<script src="assets/lab.js"></script>
<script>
(function(){
"use strict";
var P=window.PLAN,S=window.LAB.subjects,T=Lab.today();
var PC={build:"#4fd8ff",consolidate:"#9d8cff",mock:"#ff6b7d",exams:"#ffb547"};
var DAY=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
var cat={};P.catalog.forEach(function(c){cat[c.id]=c;});
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function d0(s){return new Date(s+"T12:00:00");}
function diff(a,b){return Math.round((d0(b)-d0(a))/864e5);}
function fmt(s){return d0(s).toLocaleDateString("ar",{day:"numeric",month:"long"});}

/* countdown */
var left=diff(T,P.examWindow.start);
document.getElementById("count").innerHTML='<h1>الخطة حتى الاختبارات</h1>'
 +(left>0?'<div class="big">'+left+'<small>يوماً على بداية الاختبارات</small></div>':'<div class="big" style="font-size:2.4rem">فترة الاختبارات</div>')
 +'<p>'+esc(P.examWindow.note)+' الفترة من '+fmt(P.examWindow.start)+' إلى '+fmt(P.examWindow.end)+'.</p>';

/* phases */
var ph=P.phases,order=["build","consolidate","mock","exams"];
document.getElementById("phases").innerHTML=order.map(function(k){var p=ph[k],now=T>=p.from&&T<=p.to;
  return '<div class="ph'+(now?' now':'')+'" style="--pc:'+PC[k]+'"><i></i><b>'+esc(p.name)+(now?' · الآن':'')+'</b><span>'+p.from.slice(5)+' → '+p.to.slice(5)+'</span></div>';}).join("");
var first=P.days[0].date,last=P.days[P.days.length-1].date,span=diff(first,last)+1;
var tr=document.getElementById("track");
tr.innerHTML=order.map(function(k){var p=ph[k];return '<i style="width:'+(100*(diff(p.from,p.to)+1)/span)+'%;background:'+PC[k]+'"></i>';}).join("");
var pos=diff(first,T); if(pos>=0&&pos<span){var n=document.createElement("span");n.className="needle";n.style.insetInlineStart=(100*(pos+.5)/span)+"%";tr.appendChild(n);}

/* coverage */
var lastDay={};P.days.forEach(function(d){d.items.forEach(function(it){if(it.type==="new"){lastDay[cat[it.lesson].subject]=d.date;}});});
document.getElementById("cover").innerHTML=Object.keys(S).map(function(k){
  var ls=P.catalog.filter(function(c){return c.subject===k;}),mins=ls.reduce(function(a,c){return a+c.minutes;},0),dn=ls.filter(function(c){return Lab.isDone(c.id);}).length;
  return '<div class="cv" style="--sc:'+S[k].color+'"><div class="row"><h3>'+esc(S[k].name)+'</h3>'+Lab.icon(S[k].icon,22)+'</div>'
   +'<p><b>'+ls.length+'</b> درساً · ≈ <b>'+Math.round(mins/60)+'</b> ساعة</p><p>ينتهي التعلّم: <b>'+fmt(lastDay[k])+'</b></p><p>أنجزت <b>'+dn+'</b> من '+ls.length+'</p></div>';}).join("");

/* days by week (weeks start Sunday) */
var weeks=[],cur=null;
P.days.forEach(function(d){var wd=d0(d.date).getDay();if(!cur||wd===0){cur={from:d.date,days:[]};weeks.push(cur);}cur.days.push(d);});
function item(it){
  if(it.type==="new"){var c=cat[it.lesson],s=S[c.subject],pub=Lab.lesson(c.id),done=Lab.isDone(c.id);
    var t=pub?'<a href="'+esc(pub.url)+'">'+esc(c.title)+'</a>':esc(c.title);
    return '<div class="it" style="--sc:'+s.color+'"><span class="dot"></span><span class="code">'+esc(s.name)+' '+c.code+'</span>'+t
      +(pub?' <span class="tag live">منشور</span>':'')+(done?' <span class="ok">✓</span>':'')+'<span class="m">'+c.minutes+' د · ص '+c.pages[0]+'–'+c.pages[1]+'</span></div>';}
  var sc=it.subject&&S[it.subject]?S[it.subject].color:"#9ba6d8";
  var label={weekly:"مراجعة",review:"تثبيت",mock:"تجريبي",eve:"ليلة الاختبار"}[it.type]||"";
  return '<div class="it" style="--sc:'+sc+'"><span class="dot"></span><span class="tag">'+label+'</span>'+esc(it.title||it.note||"")+'<span class="m">'+(it.minutes||"")+' د</span></div>';
}
document.getElementById("weeks").innerHTML=weeks.map(function(w,i){
  return '<div class="week"><h3>الأسبوع '+(i+1)+' · من '+fmt(w.from)+'</h3><div class="days">'+w.days.map(function(d){
    var mins=d.items.reduce(function(a,it){return a+(it.type==="new"?cat[it.lesson].minutes:(it.minutes||0));},0);
    var cls=d.date===T?" today":(d.date<T?" past":"");
    return '<div class="day'+cls+'" id="d-'+d.date+'" style="--pc:'+PC[d.phase]+'"><div class="dh"><b>'+DAY[d0(d.date).getDay()]+(d.date===T?' · اليوم':'')+'</b><time datetime="'+d.date+'">'+d.date.slice(5)+'</time><span class="mins">≈ '+mins+' دقيقة</span></div><div class="its">'+d.items.map(item).join("")+'</div></div>';
  }).join("")+'</div></div>';}).join("");
var el=document.getElementById("d-"+T); if(el&&location.hash==="#today")el.scrollIntoView({block:"center"});
})();
</script>
</body>
</html>
